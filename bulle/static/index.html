<script>/* thème et disposition avant le premier rendu, pour éviter un flash */
try { var p = JSON.parse(localStorage.getItem("bulle:profile") || "{}"); var t = p.theme === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : (p.theme || "dark"); document.documentElement.dataset.theme = t; document.documentElement.dataset.tabs = p.tabs_side || "left"; document.documentElement.dataset.covers = p.cover_style || "book"; document.documentElement.dataset.skin = ["bd", "sobre", "bling", "girly", "neon"].includes(p.skin) ? p.skin : "bd"; } catch (e) {}</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" title="Accueil">

    <b>Bu<span>lle</span></b>
  </a>
  <button class="shroom" id="shroom-btn" type="button" title="Le laboratoire (BDConverter)" aria-label="Laboratoire" hidden>

  </button>
  <form class="search" id="search-form" role="search" autocomplete="off">
    <input id="search" type="search" placeholder="Rechercher une série, un album…" aria-label="Rechercher">
  </form>
  <span class="stats" id="stats"></span>
  <button class="iconbtn" id="profile-btn" type="button" title="Profil" hidden></button>
  <button class="iconbtn" id="scan-btn" type="button" title="Rechercher les nouveaux albums (scan)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>

  </a>
</header>

    <a href="#/list/readlater" data-tab="readlater" data-drop="readlater" title="À lire — déposez ici un album ou une série">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      <span class="lbl">À lire</span><span class="cnt" data-count="readlater"></span></a>
    <i class="ono" style="--rot:5deg;--c1:#6cc3ff;margin-left:58px">Zzz…</i>
    <a href="#/list/favorites" data-tab="favorites" data-drop="favorites" title="Favoris — déposez ici un album ou une série">

    <a href="#/lists" data-tab="lists" data-drop="new" title="Listes — déposez ici pour créer une nouvelle liste">

      <span class="lbl">Historique</span></a>
    <i class="ono" style="--rot:-7deg;--c1:#ffd23f;margin-left:40px">BOUM</i>

      <span class="lbl">Collection</span></a>
    <i class="ono" style="--rot:4deg;--c1:#c084fc;margin-left:14px">TADAM !</i>
    <a href="#/adult" data-tab="adult" id="tab-adult" class="adult" title="Rubrique Adulte" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor"/></svg>
      <span class="lbl">Adulte</span><span class="cnt adultcnt">18+</span></a>
    <a href="#/random" data-tab="random" title="Ouvre un album pas encore lu, au hasard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="16" cy="8" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="8" cy="16" r="1.3" fill="currentColor"/><circle cx="16" cy="16" r="1.3" fill="currentColor"/></svg>

    <div class="grow" id="side-covers" aria-hidden="true"></div>

    <div class="drophint" aria-hidden="true">Déposez l'album ou la série sur une liste</div>

  <div class="content">
    <nav class="crumbs" id="crumbs" aria-label="Fil d'Ariane"></nav>

</div>
<div id="modal" hidden></div>
