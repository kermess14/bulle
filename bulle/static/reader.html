<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Lecture — Bulle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 6C17 6 5 16.5 5 29.5c0 7.5 4 14 10.5 18.3L13 58l12.6-6.7c2 .4 4.2.7 6.4.7 15 0 27-10.5 27-23.5S47 6 32 6z' fill='%23ffb454'/%3E%3C/svg%3E">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bulle">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="reader fit-page mode-single">
<header class="rbar top" id="top">
  <a class="rbtn" id="back" href="/" title="Retour au dossier (Échap)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <div class="rtitle"><div class="f" id="rfolder"></div><div class="n" id="rname">Chargement…</div></div>
  <div class="rcount" id="rcount"></div>
</header>

<main id="stage">
  <div class="wrap" id="single"><img id="page" alt="" draggable="false"></div>
  <div class="spread" id="spread" hidden><img id="pageA" alt="" draggable="false"><img id="pageB" alt="" draggable="false"></div>
  <div class="scroll" id="scroll" hidden></div>
  <div class="dim" id="dim" hidden></div>
  <div class="loading" id="loading" hidden></div>
</main>

<footer class="rbar bottom" id="bottom">
  <button class="rbtn" id="prev" type="button" title="Page précédente (←)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <input type="range" id="slider" min="1" max="1" value="1" aria-label="Page">
  <button class="rbtn" id="next" type="button" title="Page suivante (→ ou Espace)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="rtools">
    <button class="rbtn text" id="mode" type="button" title="Affichage : 1 page / 2 pages / défilement continu / cases (D)">1 page</button>
    <button class="rbtn" id="thumbs" type="button" title="Miniatures des pages (clic droit ou T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="6" height="10" rx="1"/><rect x="9" y="5" width="6" height="14" rx="1"/><rect x="16" y="7" width="6" height="10" rx="1"/></svg>
    </button>
    <button class="rbtn" id="panels" type="button" title="Lecture case par case (C)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 10h18M12 10v11M3 15.5h9"/></svg>
    </button>
    <button class="rbtn zbtn" id="zoomout" type="button" title="Zoom − (touche −)" aria-label="Zoom moins">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/></svg>
    </button>
    <button class="rbtn zbtn" id="zoomin" type="button" title="Zoom + (touche +)" aria-label="Zoom plus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6M10.5 7.5v6"/></svg>
    </button>
    <button class="rbtn text" id="fit" type="button" title="Ajustement : page entière / largeur / taille d'origine (F)">Page</button>
    <button class="rbtn" id="manga" type="button" title="Sens de lecture manga, de droite à gauche (M)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13m0 0-3-3m3 3-3 3M20 16H7m0 0 3-3m-3 3 3 3"/></svg>
    </button>
    <button class="rbtn" id="fs" type="button" title="Plein écran (P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</footer>

<div id="strip" class="strip" hidden><div class="strip-row" id="strip-row"></div><div class="strip-hint">Molette pour faire défiler · clic sur une page pour y aller · « ★ Couverture » au survol pour en faire la couverture · clic droit ou Échap pour fermer</div></div>
<div id="end" class="end" hidden></div>
<script src="/static/reader.js"></script>
</body>
</html>
