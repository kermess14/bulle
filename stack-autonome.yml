      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2205/api/stats', timeout=4)"]
      interval: 60s
      timeout: 5s
      start_period: 180s
      retries: 3

volumes:
  bulle-data:
  bulle-venv:
