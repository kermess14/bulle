# Tests automatiques de Bulle à chaque poussée et chaque PR : contrats de la détection des cases, mesures du banc
# d'essai, lecture simple. Sans planche réelle (les planches de la bibliothèque ne vont jamais dans le dépôt).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt html5lib
      - name: Banc d'essai (mesures)
        run: python tools/test_banc.py
      - name: Détection des cases (contrats)
        run: python tools/test_panels_contracts.py
      - name: Lecture simple
        run: python tools/test_simple.py
      - name: Plugins du laboratoire
        run: python tools/test_plugins.py
